name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
      - name: Git identity for the vault tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Tests
        run: uv run --no-sync pytest -q tests

  install:
    # What a new user does: install the tool from the repository and run its first commands.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install with uv tool
        run: uv tool install .
      - name: First commands
        shell: bash
        run: |
          r2g --help
          r2g setup --check
