{% extends "base.html" %}
{% block main %}
<h1>Delete {{ conn.name }}?</h1>
<p>This removes the connection and its list of posts. <b>Posts, media and brain notes stay.</b></p>
<p>{{ counts.total }} posts are in this connection; {{ only_here }} of them belong to no other connection.</p>
<form method="post" class="row">
  <button class="danger">Delete connection</button>
  <a href="/">Cancel</a>
</form>
{% endblock %}
