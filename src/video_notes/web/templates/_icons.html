{% macro icon(name) -%}
  <svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == 'gear' %}
      <circle cx="8" cy="8" r="2.5"/>
      <path d="M8 1.5v1.3m0 10.4v1.3M1.5 8h1.3m10.4 0h1.3M3.4 3.4l.9.9m7.4 7.4.9.9m0-9.2-.9.9m-7.4 7.4-.9.9"/>
    {% elif name == 'plus' %}
      <path d="M8 2v12M2 8h12"/>
    {% elif name == 'more' %}
      <circle cx="3" cy="8" r=".6"/>
      <circle cx="8" cy="8" r=".6"/>
      <circle cx="13" cy="8" r=".6"/>
    {% elif name == 'x' %}
      <path d="M3 3l10 10M13 3 3 13"/>
    {% elif name == 'chevron' %}
      <path d="m4 6 4 4 4-4"/>
    {% elif name == 'stop' %}
      <rect x="4" y="4" width="8" height="8" rx="1"/>
    {% elif name == 'check' %}
      <path d="m3 8 3 3 7-7"/>
    {% elif name == 'external' %}
      <path d="M9 2h5v5m0-5L7 9M12 9v5H2V4h5"/>
    {% elif name == 'play' %}
      <path d="m5 3 8 5-8 5z"/>
    {% endif %}
  </svg>
{%- endmacro %}
