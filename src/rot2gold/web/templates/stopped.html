<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ APP_NAME }} stopped</title>
  <link rel="icon" href="/static/icon.png" type="image/png">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version() }}">
</head>
<body>
  <main class="stopped">
    <h1>The app has stopped</h1>
    <p>{% if running %}The run in progress keeps going in the background. {% endif %}Open it again from your app menu (<strong>{{ APP_NAME }}</strong>) or with <code>r2g ui</code> in a terminal.</p>
    <p class="muted">You can close this tab.</p>
  </main>
</body>
</html>
