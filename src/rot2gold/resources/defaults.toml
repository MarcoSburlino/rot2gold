# Rot2Gold defaults. Your own choices live in config.toml in your config folder
# (`r2g setup --check` prints where); it only needs the values you change.
# Collection URLs live in the database (r2g conn list), not here.

[vault]
path = ""                        # your Obsidian vault; empty until setup has run
folder = "Rot2Gold"              # everything the app writes goes under this folder
videos = "Rot2Gold/Videos"       # one note per saved post
hub = "Rot2Gold/Rot2Gold.md"     # themes and topic tags across all notes
quotes = "Rot2Gold/Quotes.md"    # memorable lines, collected as notes are written
ideas = "Rot2Gold/Ideas"         # things to do
learnings = "Rot2Gold/Learnings" # things understood
events = "Rot2Gold/Events"       # things that happened or will happen
templates = "Rot2Gold/Templates" # note templates the AI follows; edit them to change the format
rules = ""                       # optional: a file in the vault with your own note rules, read by the AI
git = "auto"                     # auto (use Git if the vault is a Git repository) | on | off
after_write = []                 # commands run after each write, e.g. [["my-indexer"]]
commit_also = []                 # vault files those commands change that should be committed too

[storage]
data_dir = ""                    # videos, images, the database and logs; empty = the system's app data folder

[fetch]
delay_min = 3                    # seconds to pause between posts
delay_max = 10
max_resolution = 720             # short side of the video, in pixels

[ocr]
langs = "eng"                    # Tesseract languages for text on screen, e.g. "eng+ita+spa"
workers = 4                      # parallel tesseract processes

[whisper]
model = "medium"                 # faster-whisper model; see docs/spec.md
compute_type = "int8"

[notes]
backend = "subscription"         # subscription (claude -p with your plan login) | api (Anthropic API key in the keychain)
model = "opus"                   # passed to claude --model
batch_size = 5                   # posts per AI call
max_per_run = 20                 # notes written per Extract at most; the rest wait for the next one
stop_at_plan_usage = 0.9         # subscription: don't start another batch once the 5-hour window is this full
# max_budget_usd_per_batch = 3.0 # api backend only

[ideas]
since = "2000-01-01"             # ideas: notes finished on or after this date count as new
batch_size = 25                  # notes considered per batch of the ideas, learnings and events pass
model = "opus"
max_new_per_pass = 5             # new ideas allowed in each batch
max_new_learnings_per_pass = 8
max_new_events_per_pass = 8

[app]
port = 8740                      # http://127.0.0.1:8740
