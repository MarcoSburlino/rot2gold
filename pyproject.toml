[project]
name = "rot2gold"
version = "0.1.0"
description = "Turn saved TikTok posts into notes and ideas in Marco's brain"
requires-python = ">=3.12"
dependencies = [
  "yt-dlp[default,curl-cffi]",
  "gallery-dl",
  "faster-whisper",
  "pytesseract",
  "opencv-python-headless",
  "numpy",
  "pillow",
  "fastapi",
  "uvicorn",
  "jinja2",
  "python-multipart",
  "markdown-it-py",
  "pyyaml",
  "platformdirs",
  "tomli-w",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
r2g = "rot2gold.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
