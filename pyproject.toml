[project]
name = "rot2gold"
version = "0.1.0"
description = "Turn the TikTok videos you save into notes, ideas, learnings and events in your Obsidian vault"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["obsidian", "tiktok", "notes", "ai", "claude", "ollama"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]
requires-python = ">=3.12,<3.15"  # faster-whisper needs ctranslate2, which has no wheels for newer Pythons yet
dependencies = [
  "yt-dlp[default,curl-cffi]",
  "gallery-dl",
  "faster-whisper",
  "pytesseract",
  "opencv-python-headless",
  "numpy",
  "pillow",
  "fastapi",
  "uvicorn",
  "jinja2",
  "python-multipart",
  "markdown-it-py",
  "pyyaml",
  "platformdirs",
  "tomli-w",
  "keyring",
  "imageio-ffmpeg",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.urls]
Homepage = "https://github.com/MarcoSburlino/rot2gold"
Issues = "https://github.com/MarcoSburlino/rot2gold/issues"

[project.scripts]
r2g = "rot2gold.cli:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rot2gold = ["resources/**/*", "web/templates/*", "web/static/**/*"]
