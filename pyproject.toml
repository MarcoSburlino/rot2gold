[project]
name = "video-notes-app"
version = "0.1.0"
description = "Turn saved TikTok posts into notes and ideas in Marco's brain"
requires-python = ">=3.12"
dependencies = [
  "yt-dlp[default,curl-cffi]",
  "gallery-dl",
  "faster-whisper",
  "pytesseract",
  "opencv-python-headless",
  "numpy",
  "pillow",
  "fastapi",
  "uvicorn",
  "jinja2",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vn = "video_notes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
